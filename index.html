<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#11131c">
  <title>StudentAI — Study smarter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">

  <aside class="sidebar" id="sidebar" aria-label="StudentAI menu">
    <div class="sidebar-top">
      <div class="brand">
        <div class="brand-icon">🎓</div>
        <div>
          <h2>StudentAI</h2>
          <span>Study smarter</span>
        </div>
      </div>

      <button class="new-chat-btn" id="newChatBtn">
        <span>＋</span><b>New chat</b>
      </button>

      <div class="sidebar-title">Tools</div>
      <div class="modes" id="modes">
        <button class="mode active" data-mode="Study Mode"><span class="mode-icon">📚</span><span>Study</span></button>
        <button class="mode" data-mode="Teacher Mode"><span class="mode-icon">🧑‍🏫</span><span>Teacher</span></button>
        <button class="mode" data-mode="Homework Helper"><span class="mode-icon">📝</span><span>Homework</span></button>
        <button class="mode" data-mode="Notes Generator"><span class="mode-icon">📖</span><span>Notes</span></button>
        <button class="mode" data-mode="Question Solver"><span class="mode-icon">❓</span><span>Solver</span></button>
        <button class="mode" data-mode="Concept Explainer"><span class="mode-icon">🧠</span><span>Explain</span></button>

        <div class="extra-tools" id="extraTools">
          <button class="mode" data-mode="Current Affairs"><span class="mode-icon">📰</span><span>News</span></button>
          <button class="mode" data-mode="Web Research"><span class="mode-icon">🌐</span><span>Research</span></button>
          <button class="mode" data-mode="Science Helper"><span class="mode-icon">🧪</span><span>Science</span></button>
          <button class="mode" data-mode="Mathematics Helper"><span class="mode-icon">➗</span><span>Math</span></button>
          <button class="mode" data-mode="Coding Tutor"><span class="mode-icon">💻</span><span>Coding</span></button>
          <button class="mode" data-mode="Competitive Exam"><span class="mode-icon">🎯</span><span>Exam</span></button>
        </div>

        <button class="more-tools" id="moreTools">More tools <span>⌄</span></button>
      </div>
    </div>

    <div class="sidebar-bottom">
      <button id="profileBtn">👤 <span>Profile</span></button>
      <button id="settingsBtn">⚙️ <span>Settings</span></button>
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <main class="main">
    <header class="header">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="header-info">
        <h1>🎓 StudentAI</h1>
        <span id="currentMode">Study Mode</span>
      </div>
      <button class="clear-btn" id="clearBtn" title="New chat">🗑️</button>
    </header>

    <section class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🎓</div>
        <h2 id="welcomeTitle">What do you want to learn today?</h2>
        <p>Ask, solve, explain or make notes.</p>

        <div class="quick-actions">
          <button data-message="Explain this topic to me">📚 Ask AI</button>
          <button data-message="Make concise revision notes">📝 Notes</button>
          <button data-message="Solve this question step by step">❓ Solve</button>
          <button data-message="Explain this topic like a beginner">🧠 Explain</button>
          <button data-message="Create a study plan for me">🎯 Plan</button>
          <button data-message="Give me 5 practice MCQs">🧪 Practice</button>
        </div>
      </div>
    </section>

    <div class="input-area">
      <div class="input-box">
        <label class="input-btn" title="Attach document" aria-label="Attach document">📎
          <input id="fileInput" type="file" accept=".pdf,.txt,.doc,.docx" hidden>
        </label>
        <textarea id="messageInput" placeholder="Ask StudentAI…" rows="1" autocomplete="off"></textarea>
        <button class="input-btn" id="voiceBtn" title="Voice input" aria-label="Voice input">🎤</button>
        <button class="send-btn" id="sendBtn" title="Send" aria-label="Send">➤</button>
      </div>
      <p class="attachment-status" id="attachmentStatus"></p>
      <p class="disclaimer">AI can make mistakes. Check important information.</p>
    </div>

    <nav class="bottom-nav" aria-label="Bottom navigation">
      <button class="active" id="bottomHomeBtn">🏠<span>Home</span></button>
      <button id="bottomChatBtn">💬<span>Chat</span></button>
      <button id="bottomStudyBtn">📚<span>Study</span></button>
      <button id="bottomNewsBtn">📰<span>News</span></button>
      <button id="bottomProfileBtn">👤<span>Profile</span></button>
    </nav>
  </main>
</div>

<div class="modal-overlay hidden" id="profileModal">
  <div class="modal-card">
    <div class="modal-header"><h3>👤 Profile</h3><button class="modal-close" data-close="profileModal">✕</button></div>
    <div class="field">
      <label for="profileName">Your name</label>
      <input type="text" id="profileName" placeholder="Your name" maxlength="30">
    </div>
    <p class="modal-note">Saved only on this device.</p>
    <button class="modal-save" id="saveProfileBtn">Save</button>
  </div>
</div>

<div class="modal-overlay hidden" id="settingsModal">
  <div class="modal-card">
    <div class="modal-header"><h3>⚙️ Settings</h3><button class="modal-close" data-close="settingsModal">✕</button></div>
    <div class="field">
      <label for="educationLevel">Level</label>
      <select id="educationLevel">
        <option value="General">General</option>
        <option value="Class 6-8">Class 6–8</option>
        <option value="Class 9-10">Class 9–10</option>
        <option value="Class 11-12">Class 11–12</option>
        <option value="College/University">College / University</option>
        <option value="Competitive Exam">Competitive Exam</option>
      </select>
    </div>
    <div class="field toggle-row">
      <label for="darkModeToggle">Dark mode</label>
      <label class="switch"><input type="checkbox" id="darkModeToggle"><span class="slider"></span></label>
    </div>
    <button class="modal-save" id="saveSettingsBtn">Save</button>
    <button class="modal-danger" id="clearDataBtn">Clear local settings</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
