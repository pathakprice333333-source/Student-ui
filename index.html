<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudentAI — Your AI Study Partner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-icon">🎓</div>
      <div><h2>StudentAI</h2><span>Your AI Study Partner</span></div>
    </div>
    <button class="new-chat-btn" id="newChatBtn">＋ New Chat</button>
    <div class="sidebar-title">Student Modes</div>
    <div class="modes" id="modes">
      <button class="mode active" data-mode="Study Mode">📚 <span>Study Mode</span></button>
      <button class="mode" data-mode="Teacher Mode">🧑‍🏫 <span>Teacher Mode</span></button>
      <button class="mode" data-mode="Homework Helper">📝 <span>Homework Helper</span></button>
      <button class="mode" data-mode="Notes Generator">📖 <span>Notes Generator</span></button>
      <button class="mode" data-mode="Question Solver">❓ <span>Question Solver</span></button>
      <button class="mode" data-mode="Concept Explainer">🧠 <span>Concept Explainer</span></button>
      <button class="mode" data-mode="Current Affairs">📰 <span>Current Affairs</span></button>
      <button class="mode" data-mode="Web Research">🌐 <span>Web Research</span></button>
      <button class="mode" data-mode="Science Helper">🧪 <span>Science Helper</span></button>
      <button class="mode" data-mode="Mathematics Helper">➗ <span>Mathematics Helper</span></button>
      <button class="mode" data-mode="Coding Tutor">💻 <span>Coding Tutor</span></button>
      <button class="mode" data-mode="Competitive Exam">🎯 <span>Competitive Exam</span></button>
    </div>
    <div class="sidebar-bottom">
      <button>👤 Profile</button><button>⚙️ Settings</button>
    </div>
  </aside>

  <main class="main">
    <header class="header">
      <button class="menu-btn" id="menuBtn">☰</button>
      <div class="header-info"><h1>🎓 StudentAI</h1><span id="currentMode">Study Mode</span></div>
      <button class="clear-btn" id="clearBtn" title="Clear chat">🗑️</button>
    </header>

    <section class="chat" id="chat">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🎓</div>
        <h2>What do you want to learn today?</h2>
        <p>Ask questions, understand concepts, create notes and practice.</p>
        <div class="quick-actions">
          <button data-message="Explain this topic to me">📚 Ask AI</button>
          <button data-message="Make revision notes">📝 Make Notes</button>
          <button data-message="Solve this question step by step">❓ Solve Question</button>
          <button data-message="Explain this topic like a beginner">🧠 Explain Topic</button>
          <button data-message="Give me current affairs">📰 Current Affairs</button>
          <button data-message="Create a study plan">🎯 Study Plan</button>
          <button data-message="Give me practice MCQs">🧪 Practice MCQs</button>
        </div>
      </div>
    </section>

    <div class="input-area">
      <div class="input-box">
        <label class="input-btn" title="Attach document">📎
          <input id="fileInput" type="file" accept=".pdf,.txt,.doc,.docx" hidden>
        </label>
        <textarea id="messageInput" placeholder="Ask StudentAI anything..." rows="1"></textarea>
        <button class="input-btn" id="voiceBtn" title="Voice input">🎤</button>
        <button class="send-btn" id="sendBtn" title="Send">➤</button>
      </div>
      <p class="attachment-status" id="attachmentStatus"></p>
      <p class="disclaimer">StudentAI can make mistakes. Verify important information.</p>
    </div>

    <nav class="bottom-nav">
      <button class="active">🏠<span>Home</span></button>
      <button>💬<span>Chat</span></button>
      <button>📚<span>Study</span></button>
      <button>📰<span>News</span></button>
      <button>👤<span>Profile</span></button>
    </nav>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
